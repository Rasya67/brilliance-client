name: Build Brilliance Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Verify project files
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Java source ==="
          find src -type f

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: List generated JARs
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -la build/libs || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Brilliance-Client-JAR
          path: build/libs/*.jar
          if-no-files-found: error
